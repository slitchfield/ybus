[workspace]
members = ["sparse_mat", "powerflow", "interior_point"]
# MSRV-aware dependency resolution: when generating a lockfile, prefer dependency versions
#   that support rust-version. Cargo.lock is not committed, so CI resolves on every run.
resolver = "3"

# Shared by every crate in the workspace, which opt in with `<field>.workspace = true`
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/slitchfield/ybus"
# Oldest supported Rust, checked by the MSRV job in .github/workflows/rust.yml. Raised by
#   `<uN>::is_multiple_of` (1.87).
rust-version = "1.87"
