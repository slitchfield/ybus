[package]
name = "ybus_powerflow"
version.workspace = true
description = "Power flow for electrical grids: DC and AC power flow, optimal power flow, PTDF and LODF sensitivities and outages, validated against MATPOWER"
keywords = ["power-flow", "power-systems", "opf", "matpower", "grid"]
categories = ["science", "simulation", "mathematics"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# What the published package holds: the library's source, the README and the license texts.
#   The tests, benches and examples stay in the repository (docs/PublishingChecklist.md, P3), and
#   cargo package warns once for each, as it drops their targets from the published manifest.
include = ["/src/**/*", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/AI-DISCLAIMER.md"]

[features]
# Parallel batches: outages, PTDF and LODF columns (DcStudy::par_solve_outages,
#   DcSensitivity::par_ptdf_columns and par_lodf_columns)
rayon = ["ybus_sparse/rayon", "dep:rayon"]
# The GPU path, through ybus_cuda (which needs a CUDA 13 driver and cuSPARSE at run time, not to
#   build): DcStudy::gpu's batched DC solves and single-branch outages, DcSensitivity::gpu's
#   PTDF columns and transfers, the cuda_survey and cuda_dc_survey examples, and their tests
cuda = ["dep:ybus_cuda"]

[dependencies]
ybus_sparse.workspace = true
ybus_ipm.workspace = true
rayon = { workspace = true, optional = true }
ybus_cuda = { workspace = true, optional = true }

[dev-dependencies]
# The benchmarks in benches/, without plotting or parallel analysis, which keeps the dependency
#   tree (and cargo-deny's license check) small; results are still printed and saved
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[example]]
name = "cuda_survey"
required-features = ["cuda", "rayon"]

[[example]]
name = "cuda_dc_survey"
required-features = ["cuda", "rayon"]

[[bench]]
name = "dc_power_flow"
harness = false

[[bench]]
name = "assembly"
harness = false

[[bench]]
name = "ac_power_flow"
harness = false
