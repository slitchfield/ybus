[package]
name = "ybus_cuda"
version.workspace = true
description = "The GPU path for ybus_powerflow: sparse triangular solves with many right-hand sides on CUDA, behind a safe API"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ybus_sparse.workspace = true
# The driver API, cuSPARSE and NVRTC (which compiles kernels.cu), loaded at run time (dynamic-loading), so every machine builds this
#   crate without the CUDA toolkit and a machine without CUDA finds out when `Gpu::new` runs.
#   The bindings are CUDA 13.0's, which any CUDA 13 driver serves.
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "cusparse", "nvrtc", "dynamic-loading", "cuda-13000"] }
