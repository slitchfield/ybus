# Releases with release-plz (docs/Releasing.md, "Every release after 0.1.0"): on each push to
#   main, `release-pr` opens or updates the release PR, and `release` publishes, tags and makes
#   the GitHub release once that PR has merged (release-plz.toml's release_always = false).
#
# - Publishing is by crates.io's trusted publishing, configured for this file's name on each
#   crate: `id-token: write`, and no CARGO_REGISTRY_TOKEN.
# - Pull requests and pushes use a token from the repository's GitHub App, not GITHUB_TOKEN,
#   whose PRs don't trigger CI: the release PR runs the CI jobs like any other. The App's client
#   ID is the repository variable RELEASE_PLZ_CLIENT_ID, and its private key the secret
#   RELEASE_PLZ_PRIVATE_KEY.
# - Based on release-plz's quickstart: https://release-plz.dev/docs/github/quickstart

name: Release-plz

on:
  push:
    branches: [main]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'slitchfield' }}
    # No concurrency group: release-plz's docs say one would cancel a pending release when a new
    #   commit is pushed
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLZ_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'slitchfield' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLZ_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
