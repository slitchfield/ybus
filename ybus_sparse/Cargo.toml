[package]
name = "ybus_sparse"
version.workspace = true
description = "Sparse matrices: assembly, products, LU, Cholesky and LDLT factorizations, conjugate gradient and Matrix Market I/O"
readme = "README.md"
keywords = ["sparse", "matrix", "linear-algebra", "csr", "solver"]
categories = ["mathematics", "science"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# What the published package holds: the library's source, the README and the license texts.
#   The tests, benches and examples stay in the repository (docs/PublishingChecklist.md, P3), and
#   cargo package warns once for each, as it drops their targets from the published manifest.
include = ["/src/**/*", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/AI-DISCLAIMER.md"]

[features]
# Serialize and deserialize matrices as a shape plus a list of (row, col, value) entries
serde = ["dep:serde"]
# Parallel versions of the heavier products, prefixed `par_`
rayon = ["dep:rayon"]

[dependencies]
num-traits = "0.2"
# Complex element types, and the ComplexFloat trait that lets one code path serve real and
#   complex matrices (conj, real/imag parts, and later the solvers)
num-complex = "0.4"
serde = { version = "1", optional = true, features = ["derive"] }
rayon = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1"

# docs.rs builds the docs with every feature, and with `--cfg docsrs`, under which lib.rs labels
#   each optional item with the feature it needs. One target is enough: the API is the same on
#   every platform.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
