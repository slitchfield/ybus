[package]
name = "ybus_sparse"
version.workspace = true
description = "Sparse matrices for Rust: assembly, products, LU/Cholesky/CG solvers and Matrix Market I/O"
readme = "README.md"
keywords = ["sparse", "matrix", "linear-algebra", "csr", "solver"]
categories = ["mathematics", "science"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Serialize and deserialize matrices as a shape plus a list of (row, col, value) entries
serde = ["dep:serde"]
# Parallel versions of the heavier products, prefixed `par_`
rayon = ["dep:rayon"]

[dependencies]
num-traits = "0.2"
# Complex element types, and the ComplexFloat trait that lets one code path serve real and
#   complex matrices (conj, real/imag parts, and later the solvers)
num-complex = "0.4"
serde = { version = "1", optional = true, features = ["derive"] }
rayon = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1"
