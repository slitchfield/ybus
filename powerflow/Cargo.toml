[package]
name = "powerflow"
version = "0.1.0"
description = "DC and AC power flow built on sparse_mat"
# Not ready to publish: the API doesn't exist yet. Remove once it does.
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Parallel batches: outages, PTDF and LODF columns (DcStudy::par_solve_outages,
#   DcSensitivity::par_ptdf_columns and par_lodf_columns)
rayon = ["sparse_mat/rayon", "dep:rayon"]
# The GPU path, through ybus_cuda (which needs a CUDA 13 driver and cuSPARSE at run time, not to
#   build): DcStudy::gpu's batched DC solves, the cuda_survey example and tests that B′ and
#   Jacobian factors solve alike on the GPU
cuda = ["dep:ybus_cuda"]

[dependencies]
sparse_mat = { path = "../sparse_mat" }
interior_point = { path = "../interior_point" }
rayon = { version = "1", optional = true }
ybus_cuda = { path = "../ybus_cuda", optional = true }

[dev-dependencies]
# The benchmarks in benches/, without plotting or parallel analysis, which keeps the dependency
#   tree (and cargo-deny's license check) small; results are still printed and saved
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[example]]
name = "cuda_survey"
required-features = ["cuda", "rayon"]

[[bench]]
name = "dc_power_flow"
harness = false

[[bench]]
name = "assembly"
harness = false

[[bench]]
name = "ac_power_flow"
harness = false
