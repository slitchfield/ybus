[package]
name = "ybus_ipm"
version.workspace = true
description = "Interior-point solvers for nonlinear programs: a port of MATPOWER's MIPS, and Mehrotra's predictor-corrector"
keywords = ["optimization", "interior-point", "nonlinear", "solver", "matpower"]
categories = ["mathematics", "science", "algorithms"]
edition.workspace = true
# The workspace's license, and MIPS's for the port in src/mips.rs and its tests (LICENSE-MIPS
#   lists the files)
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
repository.workspace = true
rust-version.workspace = true
# What the published package holds: the library's source, the README and the license texts.
#   The tests, benches and examples stay in the repository (docs/PublishingChecklist.md, P3), and
#   cargo package warns once for each, as it drops their targets from the published manifest.
include = ["/src/**/*", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/LICENSE-MIPS", "/AI-DISCLAIMER.md"]

[dependencies]
ybus_sparse.workspace = true

# docs.rs builds the docs for one target: the API is the same on every platform. The crate has
#   no features; all-features and `--cfg docsrs` are set as in the other published crates.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
