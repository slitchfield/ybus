[package]
name = "ybus_ffi"
version = "0.1.0"
description = "The C interface to powerflow: opaque handles, status codes and caller-owned buffers"
# The C library is versioned and released on its own terms; see the README's ABI policy
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Named `ybus` so C links with -lybus and includes ybus.h, matching the ybus_ symbol prefix. The
#   rlib lets this crate's own Rust tests call the exports.
[lib]
name = "ybus"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Default features only: the C build has neither rayon nor cuda (docs/FfiChecklist.md, F0)
powerflow = { path = "../powerflow" }
# For the DC power flow's ordering, sparse_mat::compressed_matrix::Ordering, which powerflow
#   uses but doesn't re-export
sparse_mat = { path = "../sparse_mat" }
