# cbindgen's configuration for include/ybus.h, run by generate-header.sh (which check.sh and
#   CI run with --verify, so a stale header fails the build)

language = "C"
include_guard = "YBUS_H"
# extern "C" guards, so C++ can include the header too
cpp_compat = true
usize_is_size_t = true
# The exports' /// docs become the header's comments
documentation = true
documentation_style = "c99"
header = """
/* The C interface to ybus's powerflow: see ybus_ffi/README.md.
 *
 * Generated by cbindgen from the ybus_ffi crate; don't edit it by hand. Regenerate it with
 * ybus_ffi/generate-header.sh. */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[export]
# The status type, which the header defines with the codes
include = ["ybus_status"]

# Handles keep Rust's names in Rust and C's in the header
[export.rename]
"YbusCase" = "ybus_case"
