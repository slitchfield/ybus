# Configuration for cargo-deny (https://embarkstudios.github.io/cargo-deny/), run in CI by the
#   Dependencies job in .github/workflows/rust.yml. Locally: cargo deny --all-features check

[graph]
# Check the optional dependencies too, not just the default feature set
all-features = true

[advisories]
# Fail on any RustSec advisory (vulnerability, unmaintained, unsound or yanked crate) that
#   affects the dependency tree. An accepted advisory goes in `ignore` with a reason.
ignore = []

[licenses]
# Permissive licenses compatible with this crate's MIT OR Apache-2.0. AI-DISCLAIMER.md also
#   lists Unlicense, which only memchr (a dev-dependency, via serde_json) offers, as
#   "Unlicense OR MIT"; MIT satisfies it, and cargo-deny warns about unused allowances.
#   ISC, a permissive license equivalent to MIT, is libloading's only license: cudarc loads the
#   CUDA libraries through it, for ybus_cuda and ybus_powerflow's optional `cuda` feature.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC"]
confidence-threshold = 0.9

[bans]
# Duplicate versions only warn: they cost build time, but aren't a correctness or license issue
multiple-versions = "warn"
wildcards = "deny"
# Except path dependencies between workspace crates in unpublished (publish = false) crates,
#   such as ybus_powerflow's on ybus_sparse. A published crate still needs a version on them.
allow-wildcard-paths = true

[sources]
# Only crates.io; no git or alternative-registry dependencies
unknown-registry = "deny"
unknown-git = "deny"
